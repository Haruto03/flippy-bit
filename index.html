<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Flippy Bit</title>
    </head>
    <body>
        <h1>Flippy Bit</h1>
        <main id="main" class="flex col">
            <div id="stage">
                <svg id="svgCanvas" width="600" height="400">
                    <g id="gameOver" visibility="hidden">
                        <rect
                            x="180"
                            y="110"
                            rx="10"
                            fill="white"
                            height="140"
                            width="240"
                        ></rect>
                        <text x="300" y="152" class="title">Game Over</text>
                        <text x="300" y="190" id="finalScore">Score 0</text>
                        <text x="300" y="228" class="hint">
                            Press R to restart
                        </text>
                    </g>
                </svg>
                <div id="intro" class="overlay">
                    <div class="card">
                        <h2>How to play</h2>
                        <p>
                            Hex numbers fall toward the red line. Flip the
                            8&nbsp;bits so the row equals the lowest number
                            before it lands.
                        </p>
                        <p class="example">
                            e.g. <code>2B</code> → <code>0010 1011</code>
                        </p>
                        <table>
                            <tr>
                                <td><kbd>1</kbd>–<kbd>8</kbd> / click</td>
                                <td>Flip a bit</td>
                            </tr>
                            <tr>
                                <td><kbd>P</kbd></td>
                                <td>Pause</td>
                            </tr>
                            <tr>
                                <td><kbd>R</kbd></td>
                                <td>Restart</td>
                            </tr>
                            <tr>
                                <td><kbd>M</kbd></td>
                                <td>Sound on / off</td>
                            </tr>
                        </table>
                        <p class="start">Click or press Enter to start</p>
                    </div>
                </div>
            </div>
            <div id="sideBar" class="flex col">
                <div id="info" class="flex col">
                    <div class="text">
                        <span class="left">Score: </span>
                        <span class="right" id="scoreText">...</span>
                    </div>
                    <div class="text">
                        <span class="left">Level: </span>
                        <span class="right" id="levelText">...</span>
                    </div>
                    <div class="text">
                        <span class="left">Sound: </span>
                        <span class="right" id="soundText">On (M)</span>
                    </div>
                </div>
            </div>
        </main>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
